<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Basics</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fafafa;
      color: #222;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }
    p {
      color: #555;
    }
    .box {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <h1>JavaScript Basics</h1>
  <p>Testing out core JS concepts. Open the browser console (Press F12 &rarr; Console) to see outputs from <code>basics.js</code>.</p>

  <div class="box">
    <h3>Quick Button Test</h3>
    <p>Testing if external script is connected:</p>
    <button onclick="testAlert()">Click Me!</button>
  </div>

  <script src="basics.js"></script>
</body>
</html>
