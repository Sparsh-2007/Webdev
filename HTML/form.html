<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Form Practice</title>
</head>
<body>
  <h1>Practice Form - User Registration</h1>
  <p><a href="index.html">&larr; Back to Home</a></p>
  <hr>

  <form action="#" method="GET">
    <fieldset>
      <legend><b>Personal Information</b></legend>
      <p>
        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" placeholder="Sparsh Gupta" required>
      </p>

      <p>
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" placeholder="sparsh@example.com" required>
      </p>

      <p>
        <label for="pass">Password:</label><br>
        <input type="password" id="pass" name="password" minlength="6" placeholder="At least 6 characters" required>
      </p>

      <p>
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob">
      </p>
    </fieldset>

    <br>

    <fieldset>
      <legend><b>Coding Preferences</b></legend>
      <p>Experience Level:</p>
      <label>
        <input type="radio" name="level" value="beginner" checked> Beginner (just starting)
      </label><br>
      <label>
        <input type="radio" name="level" value="intermediate"> Intermediate
      </label><br>
      <label>
        <input type="radio" name="level" value="advanced"> Advanced
      </label>

      <p>Topics of Interest (Check all that apply):</p>
      <label>
        <input type="checkbox" name="interest" value="html" checked> HTML & CSS Layouts
      </label><br>
      <label>
        <input type="checkbox" name="interest" value="js" checked> JavaScript & DOM
      </label><br>
      <label>
        <input type="checkbox" name="interest" value="react"> React Framework
      </label><br>
      <label>
        <input type="checkbox" name="interest" value="backend"> Backend & APIs
      </label>

      <p>
        <label for="editor">Favorite Code Editor:</label><br>
        <select id="editor" name="editor">
          <option value="vscode" selected>Visual Studio Code</option>
          <option value="sublime">Sublime Text</option>
          <option value="neovim">Neovim</option>
          <option value="other">Other</option>
        </select>
      </p>

      <p>
        <label for="comments">Any notes or questions:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="40" placeholder="Type your message here..."></textarea>
      </p>
    </fieldset>

    <br>
    <button type="submit">Submit Form</button>
    <button type="reset">Clear Form</button>
  </form>

  <hr>
  <footer>
    <p><small>&copy; 2026 Sparsh Gupta &bull; HTML Forms Practice</small></p>
  </footer>
</body>
</html>
